
name: health_care

on:
  push:
    branches:
    - main
    - part5

  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Start Tests
      run: mvn test
    - name: Build with Maven
      run: mvn package -DskipTests


