spring.application.name=HealthCare
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/healthcare_db20?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true


# application.properties
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

spring.jpa.open-in-view=false
jwt.secret=your_secret_key_must_be_at_least_32_characters_long_for_HS256_algorithm
jwt.expiration=36000000





