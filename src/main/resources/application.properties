spring.application.name=HealthCare
server.port=${PORT:8080}

# Database Configuration
# NOTE: Railway's SPRING_DATASOURCE_URL might need 'jdbc:' prefix if not provided.
# We use a fallback that ensures the jdbc:mysql:// prefix if the env var is just mysql://
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis Configuration
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.url=${SPRING_DATA_REDIS_URL}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}

# JWT Configuration
jwt.secret=${JWT_SECRET:your_secret_key_must_be_at_least_32_characters_long_for_HS256_algorithm!}
jwt.expiration=${JWT_EXPIRATION:36000000}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Configuration - FIXED FOR DEPLOYMENT
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Prevent Flyway from failing if the database is not empty
spring.flyway.baseline-description=Initial Baseline






