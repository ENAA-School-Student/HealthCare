spring.application.name=HealthCare-Test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Redis for tests
spring.cache.type=simple
spring.data.redis.host=none
spring.data.redis.port=0

# Disable Flyway for tests as migrations are MySQL specific
spring.flyway.enabled=false

jwt.secret=your_secret_key_must_be_at_least_32_characters_long_for_HS256_algorithm
jwt.expiration=36000000